[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fruitfly-lab"
version = "0.1.0"
description = "Local experiment engine for the Fruit Fly Lab"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138,<0.139",
    "flygym==2.1.0",
    "mcap>=1.3,<2",
    "numpy>=2.0",
    "pyarrow>=25,<26",
    "pydantic>=2.9,<3",
    "qrcode[pil]>=8,<9",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
fruitfly-lab = "fruitfly_lab.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fruitfly_lab*"]
